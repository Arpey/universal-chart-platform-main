services:
  backend:
    build: ./backend
    ports: ['3001:3001']
    env_file: ./backend/.env
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes: ['./frontend:/app']
    command: sh -c 'npm install && npm run dev -- --host 0.0.0.0'
    ports: ['5173:5173']
    depends_on: [backend]
